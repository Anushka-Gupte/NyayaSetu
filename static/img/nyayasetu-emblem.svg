<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Concentric Dharma Chakra Ring with 24 Markers -->
  <circle cx="50" cy="50" r="47" stroke="url(#goldGradient)" stroke-width="1.2" stroke-dasharray="2 3.5" opacity="0.7"/>
  <circle cx="50" cy="50" r="43" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.9"/>
  <circle cx="50" cy="50" r="40" fill="url(#emblemBackdrop)"/>

  <!-- Ashoka Chakra Spokes in Center -->
  <circle cx="50" cy="50" r="14" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.35"/>
  <g stroke="url(#goldGradient)" stroke-width="0.6" opacity="0.3">
    <line x1="50" y1="37" x2="50" y2="63"/>
    <line x1="37" y1="50" x2="63" y2="50"/>
    <line x1="41" y1="41" x2="59" y2="59"/>
    <line x1="41" y1="59" x2="59" y2="41"/>
    <line x1="45" y1="38" x2="55" y2="62"/>
    <line x1="38" y1="45" x2="62" y2="55"/>
    <line x1="45" y1="62" x2="55" y2="38"/>
    <line x1="38" y1="55" x2="62" y2="45"/>
  </g>
  <circle cx="50" cy="50" r="3.2" fill="url(#goldGradient)"/>

  <!-- Central Judicial Pillar / Danda (Emblem of Sovereign Law) -->
  <path d="M49 19 H51 V76 H49 Z" fill="url(#goldGradient)"/>
  <!-- Lion Capital / Trishula Lotus Finial Inspiration at Top -->
  <path d="M50 11 L53 16 L50 19 L47 16 Z" fill="url(#goldGradient)"/>
  <circle cx="50" cy="11" r="1.5" fill="#FDE68A"/>
  <!-- Ashoka Chakra Pedestal Base at Plinth -->
  <path d="M43 76 H57 V79 H43 Z" fill="url(#goldGradient)"/>
  <path d="M39 79 H61 V82 H39 Z" fill="url(#goldGradient)"/>

  <!-- Balance Beam (Nyaya Tula) -->
  <path d="M21 27 C28 25 72 25 79 27 L78 29.5 C72 27.5 28 27.5 22 29.5 Z" fill="url(#goldGradient)"/>
  <!-- Center Jewel Fulcrum -->
  <circle cx="50" cy="27" r="3.5" fill="url(#goldGradient)"/>
  <circle cx="50" cy="27" r="1.8" fill="#0b1120"/>

  <!-- Left Pan Suspension Chains -->
  <line x1="23" y1="28" x2="15" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <line x1="23" y1="28" x2="23" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <line x1="23" y1="28" x2="31" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <!-- Left Pan (Nyaya Patra) -->
  <path d="M13 47 C15 56 31 56 33 47 Z" fill="url(#goldGradient)" opacity="0.95"/>
  <line x1="13" y1="47" x2="33" y2="47" stroke="url(#goldGradient)" stroke-width="1.2"/>

  <!-- Right Pan Suspension Chains -->
  <line x1="77" y1="28" x2="69" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <line x1="77" y1="28" x2="77" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <line x1="77" y1="28" x2="85" y2="47" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.85"/>
  <!-- Right Pan (Nyaya Patra) -->
  <path d="M67 47 C69 56 85 56 87 47 Z" fill="url(#goldGradient)" opacity="0.95"/>
  <line x1="67" y1="47" x2="87" y2="47" stroke="url(#goldGradient)" stroke-width="1.2"/>

  <defs>
    <linearGradient id="goldGradient" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <radialGradient id="emblemBackdrop" cx="50" cy="50" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
    </radialGradient>
  </defs>
</svg>
