<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">NyayaSetu Constitutional Passage</title>
  <desc id="logo-description">An open law book becomes a path through a court arch, inspired by the Constitution of India and access to justice.</desc>
  <circle cx="50" cy="50" r="47" fill="#FBFAF7" stroke="#E5E1D8" stroke-width="2"/>

  <!-- Court arch rises from the open pages of the Constitution. -->
  <path d="M29 68V43C29 31.4 38.4 22 50 22C61.6 22 71 31.4 71 43V68" stroke="#34345E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 67V44C38 37.4 43.4 32 50 32C56.6 32 62 37.4 62 44V67" stroke="#B88943" stroke-width="2" stroke-linecap="round"/>

  <!-- A quiet path leads from the book through the arch. -->
  <circle cx="50" cy="43" r="2.8" fill="#B88943"/>
  <path d="M50 49V72" stroke="#B88943" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 4"/>

  <!-- Open pages form the bridge and the book's central fold. -->
  <path d="M50 69C38 62 23 61 13 67V87C26 82 38 83 50 90C62 83 74 82 87 87V67C77 61 62 62 50 69Z" fill="#FFFEFA" stroke="#34345E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 70V89M19 72C29 68 39 70 46 74M19 80C29 77 39 78 46 82M81 72C71 68 61 70 54 74M81 80C71 77 61 78 54 82" stroke="#817E91" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 66C27 60 40 63 50 69C60 63 73 60 86 66" stroke="#B88943" stroke-width="2.5" stroke-linecap="round"/>
</svg>