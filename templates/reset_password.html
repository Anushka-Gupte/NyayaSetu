<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | NyayaSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-12 text-slate-100">
  <main class="mx-auto max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-6 shadow-xl sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-emerald-400">NyayaSetu account</p>
    <h1 class="mt-3 text-2xl font-bold">Set a new password</h1>
    <p class="mt-2 text-sm text-slate-300">Choose a password with at least 10 characters.</p>
    <form id="reset-form" class="mt-6 space-y-4">
      <div>
        <label for="new-password" class="mb-1 block text-sm font-medium">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-3 text-base focus:border-emerald-500 focus:outline-none">
      </div>
      <div>
        <label for="confirm-password" class="mb-1 block text-sm font-medium">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-3 text-base focus:border-emerald-500 focus:outline-none">
      </div>
      <p id="reset-message" class="hidden rounded-lg border px-3 py-2 text-sm" role="status" aria-live="polite"></p>
      <button id="reset-submit" type="submit" class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold hover:bg-emerald-600 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-emerald-400">Update password</button>
    </form>
    <a href="/auth" class="mt-5 inline-block text-sm text-emerald-300 underline">Return to sign in</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.hash.slice(1));
    const resetToken = params.get('token');
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);

    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');
    const submit = document.getElementById('reset-submit');

    function showMessage(text, success = false) {
      message.textContent = text;
      message.className = `rounded-lg border px-3 py-2 text-sm ${success ? 'border-emerald-700 bg-emerald-950 text-emerald-200' : 'border-rose-700 bg-rose-950 text-rose-200'}`;
    }

    if (!resetToken) {
      form.hidden = true;
      showMessage('This reset link is missing or invalid. Request a new password reset from the sign-in page.');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      if (password !== confirmation) {
        showMessage('The passwords do not match.');
        return;
      }
      submit.disabled = true;
      try {
        const response = await fetch('/api/v1/auth/password-reset-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, new_password: password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Password could not be updated.');
        form.hidden = true;
        showMessage('Your password has been updated. Return to sign in with your new password.', true);
      } catch (error) {
        showMessage(error.message || 'Password could not be updated.');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
